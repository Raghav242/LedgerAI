# Supply-chain and secret checks (Phase 6C). Read-only; reports, never modifies anything.
# Scanner images are pinned by digest (tag in the comment).
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly: new advisories appear without code changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency audit (pip-audit, npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: pip-audit on every pinned lock file
        run: |
          python -m pip install pip-audit==2.10.1
          for lock in requirements.lock requirements-ai.lock requirements-dev.lock; do
            pip-audit -r "$lock" --no-deps --disable-pip --progress-spinner off
          done
      - name: npm audit (production dependencies fail the job; dev dependencies are reported)
        working-directory: frontend
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical || echo "::warning::dev dependency advisories found"

  secrets:
    name: Secret scanning (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1
        # image tag: v8.28.0

  containers:
    name: Container scanning (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build images
        run: |
          docker build --target api -t ledgerflow-api:scan .
          docker build --target ai -t ledgerflow-ai:scan .
          docker build -t ledgerflow-frontend:scan frontend
      - name: Scan images for HIGH/CRITICAL vulnerabilities with a fix available
        run: |
          for image in ledgerflow-api:scan ledgerflow-ai:scan ledgerflow-frontend:scan; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
        # image tag: aquasec/trivy:0.65.0
      - name: Scan Dockerfiles and Compose for misconfigurations
        run: |
          docker run --rm -v "$PWD:/src" \
            aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            config --severity HIGH,CRITICAL --exit-code 1 /src
