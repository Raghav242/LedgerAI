# End-to-end stack tests (manual). Brings up the ISOLATED Compose project
# `ledgerflow-stacktest` on the runner (NGINX, 2 replicas, PostgreSQL, Redis, RabbitMQ,
# workers, AI worker), runs `pytest -m stack` and removes it. Destructive local experiments
# (the failure lab, benchmarks) are never run in CI: they stay manual and local-only.
name: stack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ci_only_postgres_password
      APP_DB_PASSWORD: ci_only_runtime_role_password
      RABBITMQ_USER: ledgerflow
      RABBITMQ_PASSWORD: ci_only_rabbitmq_password
      RABBITMQ_MONITOR_PASSWORD: ci_only_monitor_password
      LAB_TRAFFIC_SECRET: ci-only-lab-signing-key-not-a-secret-0123456789
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: |
          pip install -r requirements.lock -r requirements-dev.lock
          pip install --no-deps -e .
      - run: pytest -m stack -q
      - name: Logs on failure
        if: failure()
        run: docker compose -p ledgerflow-stacktest logs --no-color --tail 200 || true
