# NGINX reverse proxy / load balancer for the LedgerFlow API replicas.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    # Docker's embedded DNS, re-resolved every 5s (replicas have fixed IPs, so this mostly
    # matters for a replica that was not running when NGINX started).
    resolver 127.0.0.11 valid=5s ipv6=off;
    # Generous on purpose. For a name that no longer exists (stopped/removed replica)
    # Docker DNS needs ~7 s to answer NXDOMAIN, and only a definitive NXDOMAIN makes
    # NGINX drop that replica's addresses; a TIMEOUT keeps the old ones. With 2s, removed
    # replicas stayed in rotation forever (black-holed connects, 504s). Re-resolution
    # runs in the background, so this never delays requests.
    resolver_timeout 10s;

    log_format upstream '$time_iso8601 $remote_addr "$request" $status $request_time '
                        'upstream=$upstream_addr upstream_status=$upstream_status '
                        'upstream_time=$upstream_response_time request_id=$request_id';
    access_log /dev/stdout upstream;
    error_log /dev/stderr warn;

    client_max_body_size 64k;
    server_tokens off;

    # The upstream list is a separate file chosen by NGINX_UPSTREAMS (docker-compose.yml):
    # upstreams.2.conf by default, upstreams.4.conf with the scale4 profile. It must list
    # exactly the deployed replicas: NGINX only drops a vanished name on NXDOMAIN, and
    # Docker DNS answers SERVFAIL for removed containers, so a listed-but-removed replica
    # would stay in rotation with a dead address.
    include /etc/nginx/upstreams.conf;

    server {
        listen 8080;

        location / {
            proxy_pass http://ledgerflow_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";   # enable upstream keep-alive

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            add_header X-Request-ID $request_id always;

            # A connect on the Docker bridge takes well under 1 ms. A stopped replica's old
            # IP does not refuse connections, it black-holes them (no ARP reply), so keep
            # this short: until DNS is re-resolved, a dead address costs 0.5 s, then NGINX
            # tries the next replica. (With 2s, two stale peers produced a 504 after 4 s.)
            proxy_connect_timeout 500ms;
            proxy_send_timeout 10s;
            # Comfortably above the API's own bounds (3s lock timeout plus pool queueing):
            # a transfer that is waiting for a row lock is slow, not dead.
            proxy_read_timeout 30s;

            # Retry policy. `error timeout` covers failures to CONNECT; NGINX never passes
            # a POST to another replica once the request was sent (no `non_idempotent`),
            # so an ambiguous mid-request failure surfaces to the client as 502/504 and the
            # client retries with the same Idempotency-Key. GETs may be retried.
            # tries 0 = every server may be tried (bounded by the 5s total), so a temporarily
            # stopped replica can never turn a request into a 504.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 0;
            proxy_next_upstream_timeout 5s;
        }
    }
}
