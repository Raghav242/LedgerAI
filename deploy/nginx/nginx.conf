# NGINX reverse proxy / load balancer for the LedgerFlow API replicas.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    # Docker's embedded DNS. Re-resolve every 5s so a restarted replica (new IP) or a
    # stopped one (name disappears) is picked up without reloading NGINX.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    log_format upstream '$time_iso8601 $remote_addr "$request" $status $request_time '
                        'upstream=$upstream_addr upstream_status=$upstream_status '
                        'upstream_time=$upstream_response_time request_id=$request_id';
    access_log /dev/stdout upstream;
    error_log /dev/stderr warn;

    client_max_body_size 64k;
    server_tokens off;

    upstream ledgerflow_api {
        # Round robin (the default). Replicas have FIXED addresses (docker-compose.yml), so a
        # restarted replica comes back where NGINX expects it. `resolve` (open-source NGINX
        # >= 1.27.3, needs the shared-memory zone) lets absent replicas (api-3/api-4 without
        # the scale4 profile) simply contribute no address instead of failing startup.
        # This static upstream list is a local-Compose choice; in production the load
        # balancer's membership comes from service discovery (see docs/phase-3-design.md).
        zone ledgerflow_api 64k;
        # max_fails/fail_timeout: after one failed connection, skip that replica for 2s.
        # If EVERY replica fails at once (all-at-once redeploy) NGINX answers 502 "no live
        # upstreams" until fail_timeout expires; rolling restarts avoid that.
        server api-1:8000 resolve max_fails=1 fail_timeout=2s;
        server api-2:8000 resolve max_fails=1 fail_timeout=2s;
        # Only running with `--profile scale4`; while stopped their names do not resolve
        # and NGINX simply has no addresses for them.
        server api-3:8000 resolve max_fails=1 fail_timeout=2s;
        server api-4:8000 resolve max_fails=1 fail_timeout=2s;
        keepalive 64;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://ledgerflow_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";   # enable upstream keep-alive

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            add_header X-Request-ID $request_id always;

            # A connect on the Docker bridge takes well under 1 ms. A stopped replica's old
            # IP does not refuse connections, it black-holes them (no ARP reply), so keep
            # this short: until DNS is re-resolved, a dead address costs 0.5 s, then NGINX
            # tries the next replica. (With 2s, two stale peers produced a 504 after 4 s.)
            proxy_connect_timeout 500ms;
            proxy_send_timeout 10s;
            # Comfortably above the API's own bounds (3s lock timeout plus pool queueing):
            # a transfer that is waiting for a row lock is slow, not dead.
            proxy_read_timeout 30s;

            # Retry policy. `error timeout` covers failures to CONNECT; NGINX never passes
            # a POST to another replica once the request was sent (no `non_idempotent`),
            # so an ambiguous mid-request failure surfaces to the client as 502/504 and the
            # client retries with the same Idempotency-Key. GETs may be retried.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
    }
}
