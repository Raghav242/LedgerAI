# Upstream for 4 replicas (selected with NGINX_UPSTREAMS=4; see nginx.conf).
# Round robin (the default). Replicas have FIXED addresses (docker-compose.yml), so a
# restarted replica comes back where NGINX expects it. `resolve` (open-source NGINX
# >= 1.27.3, needs the shared-memory zone) lets NGINX start even if a listed replica is
# momentarily down. A static list is a local-Compose choice; in production load-balancer
# membership comes from service discovery (docs/phase-3-design.md).
#
# max_fails/fail_timeout: after one failed connection, skip that replica for 2s. If EVERY
# replica fails at once (all-at-once redeploy) NGINX answers 502 "no live upstreams" until
# fail_timeout expires; rolling restarts avoid that.
upstream ledgerflow_api {
    zone ledgerflow_api 64k;
    server api-1:8000 resolve max_fails=1 fail_timeout=2s;
    server api-2:8000 resolve max_fails=1 fail_timeout=2s;
    server api-3:8000 resolve max_fails=1 fail_timeout=2s;
    server api-4:8000 resolve max_fails=1 fail_timeout=2s;
    keepalive 64;
}
